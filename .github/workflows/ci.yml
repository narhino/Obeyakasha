name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: obeyakasha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/obeyakasha_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/obeyakasha_test
      AUTH_SECRET: ci-secret-0000000000000000000000000000

    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" (pnpm@10.33.0).
      # Specifying `version:` here too makes action-setup fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Apply migrations (test DB)
        run: pnpm db:migrate

      - name: Check migrations are up to date with schema
        run: |
          pnpm db:generate --name ci_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema and migrations are out of sync. Run 'pnpm db:generate' and commit."
            git --no-pager diff drizzle
            exit 1
          fi

      - name: Test (unit + integration)
        run: pnpm test

      - name: Build
        run: pnpm build
